name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out Friction
        uses: actions/checkout@v4
        with:
          repository: friction2d/friction
          ref: core-plugins
          path: friction
          submodules: recursive

      - name: Check out core plugins
        uses: actions/checkout@v4
        with:
          path: friction/src/plugins

      - name: Build
        working-directory: friction
        shell: cmd
        run: .\src\scripts\build.bat ci

      - name: Collect SVG import plugin
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem -Path friction/build/src/app/plugins -Recurse -Filter SvgImportPlugin.dll)
          if ($plugins.Count -ne 1) {
            throw "Expected one SvgImportPlugin.dll, found $($plugins.Count)."
          }
          New-Item -ItemType Directory -Force plugin-artifacts/windows | Out-Null
          Copy-Item $plugins[0].FullName plugin-artifacts/windows/SvgImportPlugin.dll

      - name: Upload SVG import plugin
        uses: actions/upload-artifact@v4
        with:
          name: svg-import-plugin-windows-x64
          path: plugin-artifacts/windows/SvgImportPlugin.dll
          if-no-files-found: error

      - name: Upload Friction packages
        uses: actions/upload-artifact@v4
        with:
          name: friction-with-svg-import-windows-x64
          path: |
            friction/build/output/friction-*.7z
            friction/build/output/friction-*.exe
          if-no-files-found: error
